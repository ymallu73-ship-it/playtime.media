<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Turtle Heart - Shifted Right</title>
    <style>
        body {
            margin: 0;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background-color: black;
        }
    </style>
</head>
<body>

<canvas id="canvas" width="700" height="700"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // **CHANGE:** X-axis ko 350 se badha kar 400 kar diya hai taaki yeh right side shift ho jaye
    ctx.translate(400, 400); 
    ctx.scale(1, -1);

    const colors = ["red", "blue", "lime", "yellow", "cyan", "magenta", "orange", "pink"];
    let i = 0;

    function animate() {
        if (i < 120) {
            let angle = i * (Math.PI * 2) / 120;
            
            // Python wale exact formulas
            let x = 16 * Math.pow(Math.sin(angle), 3) * 15;
            let y = (13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle)) * 15;
            
            let c = colors[Math.floor(Math.random() * colors.length)];
            
            // Line from starting point (0, 40) to (x, y)
            ctx.beginPath();
            ctx.moveTo(0, 40);
            ctx.lineTo(x, y);
            ctx.strokeStyle = c;
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // End point par star pattern draw karna
            drawStar(x, y, c);

            i++;
            setTimeout(() => {
                requestAnimationFrame(animate);
            }, 25); 
        }
    }

    function drawStar(startX, startY, color) {
        ctx.save();
        ctx.translate(startX, startY);
        ctx.strokeStyle = color;
        ctx.lineWidth = 1;

        for (let j = 0; j < 8; j++) {
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(6, 0);
            ctx.stroke();
            ctx.translate(6, 0);
            ctx.rotate(45 * Math.PI / 180);
            ctx.translate(-6, 0);
        }
        ctx.restore();
    }

    animate();
</script>

</body>
</html>
